<!DOCTYPE html>
<html>
<head>
  <title>Southern Street Stories</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOADING SCREEN -->
<div id="loading-screen">
  <h1>Loading Redwater County...</h1>
</div>

<!-- INTRO -->
<div id="intro-scene">
  <div class="cinematic-overlay">
    <h1 class="location-title">REDWATER COUNTY</h1>
    <p class="story-text">
      "You were gone for years.  
      Bell Creek never forgot your name."
    </p>
  </div>
</div>

<!-- MISSION UI -->
<div id="mission-box">
  <h2>MISSION</h2>
  <p id="mission-text">Drive to Redwater Gas & Oil</p>
</div>

<!-- GAME UI -->
<div id="hud">
  <p id="weather-text">Weather: Clear</p>
</div>

<!-- GAME SCRIPT -->
<script type="module" src="script.js"></script>

</body>
</html>

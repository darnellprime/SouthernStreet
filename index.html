<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Southern Street Stories</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- GTA STYLE LOADING SCREEN -->

  <div id="loading-screen">

    <div class="loading-background"></div>

    <div class="loading-overlay"></div>

    <div class="loading-content">

      <h1>
        SOUTHERN STREET STORIES
      </h1>

      <p id="loading-tip">

        "Bell Creek remembers everybody."

      </p>

      <div class="loading-bar-container">

        <div id="loading-bar"></div>

      </div>

    </div>

  </div>


  <!-- INTRO -->

  <div id="intro-scene">

    <div class="cinematic-overlay">

      <h1 class="location-title">

        REDWATER COUNTY

      </h1>

      <p class="story-text">

        "You were gone for years.
        Bell Creek never forgot your name."

      </p>

    </div>

  </div>


  <!-- MISSION -->

  <div id="mission-box">

    <h2>MISSION</h2>

    <p id="mission-text">

      Drive to Redwater Gas & Oil

    </p>

  </div>


  <!-- HUD -->

  <div id="hud">

    <div id="money">

      $2,847

    </div>

    <div id="wanted">

      ?????

    </div>

    <div id="weather-text">

      Weather: Clear

    </div>

  </div>


  <!-- RADIO -->

  <div id="radio-box">

    REDWATER FM —
    Late Night Southern Trap

  </div>


  <script type="module" src="script.js"></script>

</body>
</html>
